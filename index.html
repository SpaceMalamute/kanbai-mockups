                  <div key={wi} onClick={() => ws.active && setLeftOpen(true)} title={ws.name} style={{width:24,height:24,borderRadius:4,background:ws.active?ns.color+"20":ns.color+"08",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",position:"relative"}}>
                    <span style={{fontSize:10,fontWeight:700,color:ns.color,opacity:ws.active?1:.4}}>{ini}</span>
                    {ws.agents > 0 && <span style={{position:"absolute",top:-2,right:-2,width:6,height:6,borderRadius:"50%",background:c.working,fontSize:0}}/>}
                  </div>
                );
              })}
              <div style={{flex:1}}/>
              <div style={{fontSize:6,color:c.t4,fontFamily:mono,marginBottom:8,writingMode:"vertical-rl",opacity:.4}}>{"⌘B"}</div>
            </div>
            {/* Expanded */}
            <div style={{width:210,display:"flex",flexDirection:"column",height:"100%",opacity:leftOpen?1:0,transition:"opacity .2s ease",pointerEvents:leftOpen?"auto":"none"}}>
              <div style={{display:"flex",alignItems:"center",padding:"4px 8px",gap:6,flexShrink:0}}>
                <span style={{fontSize:9,fontWeight:500,color:c.t4,textTransform:"uppercase",letterSpacing:.5}}>Workspaces</span>
                <div style={{flex:1}}/>
                <div onClick={() => setLeftOpen(false)} style={{padding:"2px",borderRadius:2,cursor:"pointer",opacity:.4}}><Ph d={P.sidebar} s={12} color={c.t3}/></div>
              </div>
              <div style={{flex:1,overflow:"auto",padding:"0 2px"}}>
                <TI name="ideaforge" isWs isOpen active nsColor={ns.color} agents={2}/>
                <div style={{marginLeft:14,paddingLeft:6,borderLeft:"1px solid "+ns.color+"15"}}>
                  <TI name="electron" isProj isOpen active parentActive/>
                  <div style={{marginLeft:12,paddingLeft:6,borderLeft:"1px solid rgba(255,255,255,0.04)"}}>
                    <TI name="src" isFolder isOpen parentActive/>
                    <div style={{marginLeft:12,paddingLeft:6,borderLeft:"1px solid rgba(255,255,255,0.04)"}}>
                      <TI name="main" isFolder isOpen parentActive/>
                      <div style={{marginLeft:12,paddingLeft:6,borderLeft:"1px solid rgba(255,255,255,0.04)"}}>
                        <TI name="ipc" isFolder isOpen parentActive/>
                        <div style={{marginLeft:12,paddingLeft:6,borderLeft:"1px solid rgba(255,255,255,0.04)"}}>
                          <TI name="git.ts" active modified/>
                          <TI name="workspace.ts" modified/>
                          <TI name="terminal.ts"/>
                          <TI name="kanban.ts"/>
                          <TI name="ai-session.ts"/>
                          <TI name="database.ts"/>
                          <TI name="health.ts"/>
                        </div>
                        <TI name="services" isFolder isOpen/>
                        <div style={{marginLeft:12,paddingLeft:6,borderLeft:"1px solid rgba(255,255,255,0.04)"}}>
                          <TI name="storage.ts"/>
                          <TI name="mcp-server.ts"/>
                          <TI name="updater.ts"/>
                        </div>
                      </div>
                      <TI name="preload" isFolder/>
                      <TI name="renderer" isFolder isOpen/>
                      <div style={{marginLeft:12,paddingLeft:6,borderLeft:"1px solid rgba(255,255,255,0.04)"}}>
                        <TI name="components" isFolder isOpen/>
                        <div style={{marginLeft:12,paddingLeft:6,borderLeft:"1px solid rgba(255,255,255,0.04)"}}>
                          <TI name="KanbanBoard.tsx"/>
                          <TI name="Terminal.tsx"/>
                          <TI name="Editor.tsx"/>
                          <TI name="GitPanel.tsx"/>
                          <TI name="Sidebar.tsx"/>
                          <TI name="StatusBar.tsx"/>
                        </div>
                        <TI name="lib" isFolder/>
                        <TI name="styles" isFolder/>
                        <TI name="App.tsx"/>
                        <TI name="index.tsx"/>
                      </div>
                      <TI name="shared" isFolder/>
                    </div>
                    <TI name="tests" isFolder/>
                    <TI name="scripts" isFolder/>
                    <TI name="package.json"/>
                    <TI name="tsconfig.json"/>
                    <TI name="vite.config.ts"/>
                    <TI name="CLAUDE.md"/>
                    <TI name="AGENTS.md"/>
                  </div>
                  <TI name="api" isProj/>
                  <TI name="web" isProj/>
                </div>
                <TI name="portfolio" isWs nsColor={ns.color} shortcut={"⌘ 2"}/>
                <TI name="side-project" isWs nsColor={ns.color} shortcut={"⌘ 3"}/>
              </div>
            </div>
          </div>
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {/* Content */}
          <div style={{flex:1,display:"flex",overflow:"hidden"}}>{Active()}</div>
          {/* ═══ TERMINAL BOTTOM SHEET ═══ */}
          <div style={{height:termOpen?200:32,background:c.raised,borderRadius:"3px 3px 0 0",margin:"0 4px 0 0",overflow:"hidden",flexShrink:0,transition:"height .2s cubic-bezier(.4,0,.2,1)",display:"flex",flexDirection:"column"}}>
            {/* Tab bar */}
            <div onDoubleClick={() => setTermOpen(!termOpen)} style={{display:"flex",alignItems:"center",gap:1,padding:"0 8px",height:32,flexShrink:0,cursor:"pointer",userSelect:"none"}}>
              <span onClick={(e) => {e.stopPropagation();setTermOpen(!termOpen)}} style={{display:"flex",alignItems:"center",color:c.t4,marginRight:4,transform:termOpen?"rotate(180deg)":"none",transition:"transform .2s",cursor:"pointer"}}><Ph d={P.caretDown} s={10} color={c.t4}/></span>
              {[{name:"zsh",active:false},{name:"Riku-7 · async-ipc",agent:"claude",active:true,dot:c.working},{name:"Vex-3 · electron-41",agent:"codex"}].map((tab,i) => (
                <div key={i} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:2,fontSize:11,color:tab.active?c.t1:c.t3,background:tab.active?c.surface:"transparent",cursor:"pointer"}}>
                  {tab.agent ? <Bot agent={tab.agent} state={tab.active?"working":"idle"} s={12}/> : <span style={{width:5,height:5,borderRadius:"50%",background:c.t4,opacity:.5}}/>}
                  {tab.name}{tab.dot && <Glow color={tab.dot} pulse s={3}/>}
                </div>
              ))}
              <div style={{flex:1}}/>
              <span style={{fontSize:8,fontFamily:mono,color:c.t4}}>⌘`</span>
            </div>
            {termOpen && (
              <Fragment>
                {/* Metadata bar */}
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"2px 12px 4px",fontSize:9,color:c.t4,flexShrink:0}}>
                  <span style={{fontFamily:mono,color:c.cyan}}>~/ideaforge</span>
                  <span style={{opacity:.3}}>|</span><span style={{fontFamily:mono,color:c.purpleL}}>feat/async-ipc</span>
                  <span style={{opacity:.3}}>|</span><span>zsh 5.9</span>
                  <span style={{opacity:.3}}>|</span><Bot agent="claude" state="working" s={10}/><span style={{color:c.working}}>Riku-7</span><span>Opus</span>
                  <span style={{opacity:.3}}>|</span><span style={{fontFamily:mono,color:c.working}}>{Math.floor(t/60)}:{String(t%60).padStart(2,"0")}</span>
                  <div style={{flex:1}}/><span style={{fontFamily:mono}}><span style={{color:c.done}}>12</span><span style={{color:c.t4}}>/23</span> handlers</span>
                </div>
                {/* Terminal output */}
                <div style={{flex:1,padding:"4px 14px 8px",fontFamily:mono,fontSize:11,lineHeight:1.7,color:c.t2,overflow:"auto"}}>
                  <div style={{color:c.t3}}>$ claude --model opus "Refactor IPC handlers to async"</div>
                  <div style={{marginTop:6,padding:"6px 10px",background:`${c.working}06`,borderRadius:3,position:"relative"}}>
                    <div style={{position:"absolute",left:0,top:4,bottom:4,width:2,borderRadius:1,background:`${c.working}30`}}/>
                    <div style={{color:c.t3,fontSize:10}}>Reading 23 IPC handler files across <span style={{color:c.blue}}>src/main/ipc/</span></div>
                    <div style={{color:c.t3,fontSize:10,marginTop:2}}>Progress: <span style={{color:c.done}}>12</span><span style={{color:c.t4}}>/23</span> handlers migrated</div>
                    <div style={{color:c.t3,fontSize:10}}>Currently: <span style={{color:c.blue}}>git.ts</span><span style={{color:c.t4}}> → </span>converting <span style={{color:"#E8D44D"}}>getCommitHistory()</span></div>
                  </div>
                  <div style={{marginTop:6,color:c.t4,fontSize:10}}><span style={{color:c.done}}>M</span> git.ts +42 -38 | <span style={{color:c.done}}>M</span> workspace.ts +28 -24</div>
                  <div style={{marginTop:2}}><span style={{animation:"blink 1s step-end infinite",color:c.t1}}>▊</span></div>
                </div>
              </Fragment>
            )}
          </div>
        </div>
        <RightPane/>
      </div>

      {/* ═══ STATUS BAR ═══ */}
      <div style={{height:24,display:"flex",alignItems:"center",padding:"0 14px",background:c.base,fontSize:8,color:c.t4,gap:6,fontFamily:mono,flexShrink:0,zIndex:1}}>
        <Glow color={c.done} s={3}/><span>2 agents</span>
        <span style={{opacity:.3}}>|</span>
        <Bot agent="claude" state="working" s={9}/><span style={{color:c.working}}>working</span><span>{Math.floor(t/60)}:{String(t%60).padStart(2,"0")}</span>
        <span style={{opacity:.3}}>|</span>
        <span style={{color:c.purpleL}}>feat/async-ipc</span>
        <span style={{opacity:.3}}>|</span>
        <span><span style={{color:c.done}}>+70</span> <span style={{color:c.failed}}>-62</span></span>
        <div style={{flex:1}}/>
        <span>Node 22.4.0</span>
        <span style={{opacity:.3}}>|</span>
        <span>Electron 40</span>
        <span style={{opacity:.3}}>|</span>
        <span>TypeScript</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<KanbaiV14 />);
</script>
</body>
</html>
